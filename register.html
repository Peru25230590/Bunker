<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="stylesheet" href="./css/style.css">
    <title>Create account — BUNKER</title>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="brand" href="./vault.html"><span class="brand-icon">B</span><span>BUNKER<small>your personal vault</small></span></a>
      <p class="eyebrow">MAKE YOURSELF AT HOME</p>
      <h1>Create account</h1>
      <p class="lede">A little space of your own, ready when you are.</p>
      <form data-form="register">
        <label for="display-name">Display name</label>
        <input id="display-name" name="displayName" autocomplete="name" required minlength="1" maxlength="50">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="320">
        <label for="password">Password <span class="field-hint">At least 8 characters</span></label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
        <button class="button button-full" type="submit">Create account</button>
      </form>
      <p class="notice" data-notice role="status"></p>
      <p class="auth-switch">Already have an account? <a href="./login.html">Sign in</a></p>
      <a class="back-link" href="./vault.html">← Back to BUNKER</a>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
