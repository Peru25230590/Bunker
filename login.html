<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="stylesheet" href="./css/style.css">
    <title>Sign in — BUNKER</title>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="brand" href="./index.html"><span class="brand-icon">B</span><span>BUNKER<small>your personal vault</small></span></a>
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Sign in</h1>
      <p class="lede">Your quiet corner is right where you left it.</p>
      <form data-form="login">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="320">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
        <button class="button button-full" type="submit">Sign in</button>
        <button class="text-button" type="button" data-action="reset-password">Forgot password?</button>
      </form>
      <p class="notice" data-notice role="status"></p>
      <p class="auth-switch">New to BUNKER? <a href="./register.html">Create an account</a></p>
      <a class="back-link" href="./index.html">← Back to BUNKER</a>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
